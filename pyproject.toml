[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "somnox"
version = "0.1.0"
description = "Lecture OCR et analyse experte des comptes rendus de polygraphie ventilatoire, hors ligne."
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "pytesseract>=0.3.10",
  "watchdog>=4.0",
  "python-docx>=1.1",
  "jinja2>=3.1",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
somnox = "somnox.cli:main"

[tool.setuptools]
packages = ["somnox", "somnox.ui"]
include-package-data = true

[tool.setuptools.package-data]
somnox = ["templates/*.j2", "theme.qss"]
